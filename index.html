<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Indian Bike Rider 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cc7d8;font-family:system-ui;color:white}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.brand,.stats,.help,.tag{position:absolute;background:#071522cc;border:1px solid #ffffff55;border-radius:12px;padding:9px 12px}.brand{top:12px;left:12px;font-weight:900;letter-spacing:1px}.stats{top:12px;right:12px;text-align:right;font-weight:800}.stats small{display:block;color:#c3d8df}.help{top:68px;left:12px;font-size:12px}.tag{bottom:104px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}
.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.cluster{display:flex;gap:9px;align-items:end}.control{width:64px;height:64px;border:1px solid #ffffff88;border-radius:50%;background:#081722bb;color:white;font-size:22px;font-weight:900;touch-action:none}.control:active,.control.on{background:#e0a32b;color:#111}.control.tall{width:76px;height:76px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#071522bb;z-index:4}#start .panel{width:min(88vw,420px);padding:26px;border:1px solid #ffffff66;border-radius:20px;background:#122334;text-align:center}#start h1{margin:0 0 8px}#start p{color:#c5d7df;line-height:1.5}#start button{border:0;border-radius:12px;padding:14px 28px;background:#e3a32e;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div id="hud"><div class="brand">🏍 INDIAN BIKE RIDER 3D</div><div class="stats"><span id="speed">0</span> km/h<small id="distance">0 m travelled</small></div><div class="help">W / ↑ accelerate · S / ↓ brake · A D / ← → steer</div><div class="tag">Explore the city • Avoid traffic • Enjoy the ride</div>
<div class="controls"><div class="cluster"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div><div class="cluster"><button class="control" data-key="brake">Ⅱ</button><button class="control tall" data-key="gas">▲</button></div></div></div>
<div id="start"><div class="panel"><h1>INDIAN BIKE RIDER 3D</h1><p>Ride through an Indian-inspired city. Use touch controls or your keyboard. This is a first playable browser demo.</p><button id="play">START RIDING</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc7d8);scene.fog=new THREE.Fog(0x9cc7d8,65,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x6b5946,2));const sun=new THREE.DirectionalLight(0xffe1b3,3);sun.position.set(-35,60,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x30363b),concrete=mat(0xbab8ae),yellow=mat(0xe5b83f),black=mat(0x101316),rubber=mat(0x090b0d),chrome=mat(0xbac6ca,.25,.85),red=mat(0xc92820,.35,.25);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x718b62));ground.rotation.x=-Math.PI/2;ground.position.y=-.13;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,500),asphalt);road.rotation.x=-Math.PI/2;road.position.y=-.08;road.receiveShadow=true;scene.add(road);
for(const x of [-6.8,6.8]){const curb=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,500),concrete);curb.position.set(x,0,0);scene.add(curb)}
for(let z=-240;z<250;z+=12){const dash=new THREE.Mesh(new THREE.BoxGeometry(.14,.025,5),yellow);dash.position.set(0,.01,z);scene.add(dash)}
function building(x,z,w,h,d,color){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));b.position.y=h/2;b.castShadow=true;g.add(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.22,d+.25),mat(0x8d5540));roof.position.y=h+.1;g.add(roof);for(let yy=2;yy<h-1;yy+=2.4)for(let xx=-w/2+.8;xx<w/2-.3;xx+=1.7){const win=new THREE.Mesh(new THREE.BoxGeometry(.85,.95,.06),mat(0x31566a,.25,.2));win.position.set(xx,yy,d/2+.035);g.add(win)}g.position.set(x,0,z);scene.add(g)}
const colors=[0xd7b58a,0xe3d5b9,0xb7c5b1,0xd9a78c,0xc5c2a9,0x9db8bd];
for(let z=-230;z<240;z+=22){building(-13-Math.random()*3,z,7+Math.random()*3,8+Math.random()*17,8,colors[Math.floor(Math.random()*colors.length)]);building(13+Math.random()*3,z-9,7+Math.random()*3,9+Math.random()*15,8,colors[Math.floor(Math.random()*colors.length)])}
function tree(x,z){const t=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2.2,7),mat(0x68442b));trunk.position.y=1.1;t.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,10,8),mat(0x397344));crown.position.y=3;t.add(crown);t.position.set(x,0,z);scene.add(t)}
for(let z=-230;z<240;z+=17){tree(-8.5,z+4);tree(8.5,z-3)}
const bike=new THREE.Group();scene.add(bike);const wheelParts=[];
function mesh(parent,geo,material,pos,rot){const o=new THREE.Mesh(geo,material);o.position.set(...pos);if(rot)o.rotation.set(...rot);o.castShadow=true;parent.add(o);return o}
function wheel(z){const w=new THREE.Group();w.position.set(0,.72,z);bike.add(w);mesh(w,new THREE.TorusGeometry(.62,.14,12,28),rubber,[0,0,0]);mesh(w,new THREE.TorusGeometry(.43,.045,8,24),chrome,[0,0,0]);mesh(w,new THREE.CylinderGeometry(.09,.09,.18,16),chrome,[0,0,0],[Math.PI/2,0,0]);for(let i=0;i<8;i++){const s=mesh(w,new THREE.BoxGeometry(.025,.82,.025),chrome,[0,0,0]);s.rotation.z=i*Math.PI/4}wheelParts.push(w)}
wheel(-1.12);wheel(1.15);
mesh(bike,new THREE.BoxGeometry(.34,.18,1.7),chrome,[0,1.05,0],[.15,0,0]);mesh(bike,new THREE.BoxGeometry(.72,.35,.95),red,[0,1.45,-.05],[.12,0,0]);mesh(bike,new THREE.BoxGeometry(.58,.16,.65),black,[0,1.69,-.1]);mesh(bike,new THREE.BoxGeometry(.5,.16,.7),mat(0x17191c),[0,1.22,.66]);mesh(bike,new THREE.BoxGeometry(.48,.55,.45),red,[0,1.35,.92],[-.2,0,0]);
mesh(bike,new THREE.CylinderGeometry(.16,.16,.48,16),chrome,[-.37,1.03,-.25],[0,0,Math.PI/2]);mesh(bike,new THREE.CylinderGeometry(.16,.16,.48,16),chrome,[.37,1.03,-.25],[0,0,Math.PI/2]);mesh(bike,new THREE.BoxGeometry(1.15,.08,.08),chrome,[0,2.03,1.05],[0,0,.08]);mesh(bike,new THREE.BoxGeometry(.12,.5,.12),chrome,[0,1.8,1.05]);mesh(bike,new THREE.BoxGeometry(.42,.2,.12),mat(0xfff4c8,.2),[0,1.62,1.43]);mesh(bike,new THREE.BoxGeometry(.3,.12,.1),red,[0,1.48,-.78]);mesh(bike,new THREE.BoxGeometry(.32,.38,.55),black,[0,1.92,-.28],[.3,0,0]);mesh(bike,new THREE.BoxGeometry(.34,.42,.35),mat(0x263f56),[0,2.25,-.25]);bike.position.z=2.5;
const traffic=[];function car(z,lane){const g=new THREE.Group();mesh(g,new THREE.BoxGeometry(1.65,.65,3),mat([0x2877a8,0xc94b35,0xd7d2c4,0x36845a][Math.floor(Math.random()*4)],.35),[0,.65,0]);mesh(g,new THREE.BoxGeometry(1.4,.62,1.45),mat(0x8db6c4,.2),[0,1.22,-.25]);for(const x of [-.88,.88])for(const zz of [-.95,.95]){const q=mesh(g,new THREE.CylinderGeometry(.28,.28,.18,12),rubber,[x,.38,zz],[0,0,Math.PI/2])}g.position.set(lane,0,z);scene.add(g);traffic.push(g)}
for(let i=0;i<10;i++)car(-35-i*24,[-3.8,3.8][i%2]);
const keys={};let started=false,speed=0,travel=0,steer=0;function setKey(k,v){keys[k]=v}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow'))e.preventDefault();setKey(k,true)});addEventListener('keyup',e=>setKey(e.key.toLowerCase(),false));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();setKey(k,true);b.classList.add('on')},up=e=>{e.preventDefault();setKey(k,false);b.classList.remove('on')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(started){const gas=keys.gas||keys.w||keys.arrowup,brake=keys.brake||keys.s||keys.arrowdown;speed=THREE.MathUtils.damp(speed,gas?34:brake?0:15,gas?1.1:brake?4:.35,dt);speed=THREE.MathUtils.clamp(speed,0,95);const steerInput=(keys.right||keys.d||keys.arrowright?1:0)-(keys.left||keys.a||keys.arrowleft?1:0);steer=THREE.MathUtils.damp(steer,steerInput,5,dt);bike.position.x=THREE.MathUtils.clamp(bike.position.x+steer*dt*(2.5+speed*.055),-5.1,5.1);bike.rotation.z=-steer*.13;wheelParts.forEach(w=>w.rotation.x-=speed*dt*.055);const move=speed*dt*.16;travel+=move*10;for(const c of traffic){c.position.z+=move*1.8;if(c.position.z>12)c.position.z=-230-Math.random()*60;if(Math.abs(c.position.x-bike.position.x)<1.35&&Math.abs(c.position.z-bike.position.z)<1.65&&speed>8)speed*=.965}camera.position.x=THREE.MathUtils.damp(camera.position.x,bike.position.x*.55,3,dt);camera.lookAt(bike.position.x*.35,1.1,-8);document.getElementById('speed').textContent=Math.round(speed);document.getElementById('distance').textContent=Math.round(travel)+' m travelled'}renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
